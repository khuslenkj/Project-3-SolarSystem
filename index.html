<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solar System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div style="--orbit-size: 250px; --orbit-animation: rotation 8.8s linear infinite;" class="orbit">
        <img style="--planet-size: 15px; --planet-left: 117.5px; --planet-top: -7.5px; --planet-animation: selfrotation 5.86s linear infinite;" class="planet" src="mercury.png" alt="">
    </div>
    <div style="--orbit-size: 300px; --orbit-animation: rotation 22.5s linear infinite;" class="orbit">
        <img style="--planet-size: 20px; --planet-left: 150px; --planet-top: -10px; --planet-animation: selfrotation 24.3s linear infinite;" class="planet" src="venus.png" alt="">
    </div>
    <div style="--orbit-size: 400px; --orbit-animation: rotation 36.5s linear infinite;" class="orbit">
        <img style="--planet-size: 23px; --planet-left: 200px; --planet-top: -11.5px; --planet-animation: selfrotation 1s linear infinite;" class="planet" src="earth.png" alt="">
    </div>
    <div style="--orbit-size: 500px; --orbit-animation: rotation 68.7s linear infinite;" class="orbit">
        <img style="--planet-size: 17px; --planet-left: 250px; --planet-top: -8.5px; --planet-animation: selfrotation 1.025s linear infinite;" class="planet" src="mars.png" alt="">
    </div>
    <div style="--orbit-size: 650px; --orbit-animation: rotation 118.6s linear infinite;" class="orbit">
        <img style="--planet-size: 45px; --planet-left: 325px; --planet-top: -22.5px; --planet-animation: selfrotation 0.41s linear infinite;" class="planet" src="jupiter.png" alt="">
    </div>
    <div style="--orbit-size: 750px; --orbit-animation: rotation 294.6s linear infinite;" class="orbit">
        <img style="--planet-size: 40px; --planet-left: 375px; --planet-top: -20px; --planet-animation: selfrotation 0.445s linear infinite;" class="planet" src="saturn.png" alt="">
    </div>
    <div style="--orbit-size: 850px; --orbit-animation: rotation 840s linear infinite;" class="orbit">
        <img style="--planet-size: 35px; --planet-left: 425px; --planet-top: -17.5px; --planet-animation: selfrotation 0.717s linear infinite;" class="planet" src="uranus.png" alt="">
    </div>
    <div style="--orbit-size: 950px; --orbit-animation: rotation 1648s linear infinite;" class="orbit">
        <img style="--planet-size: 33px; --planet-left: 475px; --planet-top: -16.5px; --planet-animation: selfrotation 0.671s linear infinite;" class="planet" src="neptune.png" alt="">
    </div>
    <img class="sun" src="sun.png" alt="">
</body>
</html>
